name: infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml', 'ps-rule.yaml', '.ps-rule/**']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', 'ps-rule.yaml', '.ps-rule/**']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to Azure, no stored secrets
  contents: read

env:
  RG: rg-wr-lab-uks
  TEMPLATE: infra/main.bicep

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build and lint
        run: az bicep build --file $TEMPLATE
      # Pre-install the pinned versions; the action reuses installed modules
      # instead of pulling latest. Keep in step with `requires` in ps-rule.yaml.
      - name: Install pinned PSRule modules
        shell: pwsh
        run: |
          Install-Module PSRule -RequiredVersion 2.9.0 -Repository PSGallery -Scope CurrentUser -Force
          Install-Module PSRule.Rules.Azure -RequiredVersion 1.47.0 -Repository PSGallery -Scope CurrentUser -Force
      - name: PSRule for Azure (blocking)
        uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          version: '2.9.0'
          modules: PSRule.Rules.Azure
          option: ps-rule.yaml
          baseline: '@pinned'   # Azure.GA_2025_12, set in ps-rule.yaml
          inputPath: infra/
          outputFormat: Sarif
          outputPath: reports/ps-rule-results.sarif
      - name: Upload PSRule results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps-rule-results
          path: reports/ps-rule-results.sarif
          if-no-files-found: warn

  whatif:
    needs: validate
    runs-on: ubuntu-latest
    environment: lab-plan
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if preview
        run: az deployment group what-if -g $RG -f $TEMPLATE

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: whatif
    runs-on: ubuntu-latest
    environment: lab   # requires Wayne's approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: az deployment group create -g $RG -f $TEMPLATE --name "gh-${{ github.run_number }}"

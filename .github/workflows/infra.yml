name: infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to Azure, no stored secrets
  contents: read

env:
  RG: rg-wr-lab-uks
  TEMPLATE: infra/main.bicep

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build and lint
        run: az bicep build --file $TEMPLATE
      - name: PSRule for Azure (Well-Architected checks)
        uses: microsoft/ps-rule@v2
        continue-on-error: true   # report only during phase 0
        with:
          modules: PSRule.Rules.Azure
          inputPath: infra/

  whatif:
    needs: validate
    runs-on: ubuntu-latest
    environment: lab-plan
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if preview
        run: az deployment group what-if -g $RG -f $TEMPLATE

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: whatif
    runs-on: ubuntu-latest
    environment: lab   # requires Wayne's approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: az deployment group create -g $RG -f $TEMPLATE --name "gh-${{ github.run_number }}"
